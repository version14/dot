name: Template Dependency Check

# The PR-facing half of this check (scan + step summary + PR comment) lives
# in ci.yml's dep-scan job, alongside the rest of the per-PR pipeline. This
# workflow only handles the scheduled/manual bot run that opens dependency
# bump PRs and deprecation issues on its own — it has no PR-review purpose,
# so it stays out of the PR check graph.
on:
  schedule:
    # Every Wednesday at 09:00 UTC — offset from Dependabot (Monday) to
    # avoid PR pile-ups on the same day.
    - cron: "0 9 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan template dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/dep-scan-core

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dep-report
          path: dep-report.json
          retention-days: 7

  # Creates PRs and issues from the scan job's report.
  process:
    name: Open PRs and issues
    runs-on: ubuntu-latest
    needs: scan
    environment: ci
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build dep-checker
        run: make build ARGS="-t dep-checker"

      - name: Download scan report
        uses: actions/download-artifact@v8
        with:
          name: dep-report

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          gh label create "dependencies" --color "0075ca" --description "Dependency updates" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh label create "deprecated"   --color "e4e669" --description "Deprecated package" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true

      - name: Process outdated and deprecated dependencies
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: .github/scripts/dep-checker-process.sh
