name: Dependency Review

on:
  workflow_call:

jobs:
  dependency-review:
    name: Scan dependency changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
