name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  commitlint:
    uses: ./.github/workflows/commitlint.yml
    permissions:
      contents: read
      pull-requests: write

  dependency-review:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/dependency-review.yml
    permissions:
      contents: read
      pull-requests: write

  dep-scan:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/dep-scan.yml
    permissions:
      contents: read
      pull-requests: write

  test:
    uses: ./.github/workflows/unit-tests.yml

  build:
    needs: [validate, test]
    uses: ./.github/workflows/build.yml

  test-flows:
    needs: [build]
    uses: ./.github/workflows/test-flows.yml
