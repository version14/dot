name: Test Flows

on:
  workflow_call:
    inputs:
      no_cache:
        description: >-
          Bypass the per-fixture cache and run every command from scratch.
          Used by the monthly clean-run workflow as an integrity check on
          the fingerprint logic itself, independent of cached state.
        type: boolean
        default: false

jobs:
  list:
    name: Discover flow fixtures
    runs-on: ubuntu-latest
    outputs:
      fixtures: ${{ steps.list.outputs.fixtures }}
    steps:
      - uses: actions/checkout@v7

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: dot-binaries-linux-amd64
          path: bin/

      - name: Make binaries executable
        run: chmod +x bin/*

      - name: List enabled fixtures
        id: list
        run: echo "fixtures=$(./bin/test-flow -dir tools/test-flow/testdata -list)" >> "$GITHUB_OUTPUT"

  # One job per fixture so results land in parallel instead of streaming
  # through a single sequential loop. fail-fast cancels the rest of the
  # matrix the moment one fixture fails.
  run:
    name: "E2E: ${{ matrix.fixture }}"
    runs-on: ubuntu-latest
    needs: list
    strategy:
      fail-fast: true
      matrix:
        fixture: ${{ fromJson(needs.list.outputs.fixtures) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: dot-binaries-linux-amd64
          path: bin/

      - name: Make binaries executable
        run: chmod +x bin/*

      # Scoped to this matrix job's own fixture — each job only ever reads
      # or writes .test-flow-cache/<fixture>.json, so a shared key across
      # the whole matrix would just be unnecessary contention, not a
      # correctness issue. The save key includes run_id because actions/
      # cache silently skips saving over an existing exact key; restore-keys
      # falls back to the most recent prior save for this fixture. GitHub's
      # own eviction (7-day-unused, 10GB/repo) keeps this from growing
      # unbounded — entries here are a few hundred bytes each.
      - name: Restore fixture cache
        if: ${{ !inputs.no_cache }}
        uses: actions/cache@v4
        with:
          path: .test-flow-cache/${{ matrix.fixture }}.json
          key: test-flow-cache-${{ matrix.fixture }}-${{ github.run_id }}
          restore-keys: |
            test-flow-cache-${{ matrix.fixture }}-

      - name: Run flow fixture
        run: ./bin/test-flow -dir tools/test-flow/testdata -only "${{ matrix.fixture }}" ${{ inputs.no_cache && '-no-cache' || '' }}
